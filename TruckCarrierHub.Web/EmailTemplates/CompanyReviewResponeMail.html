<!DOCTYPE html>
<html>
<head>
    <style>
        .panel {
            height: auto;
            width: 98%;
            margin: auto;
            background-color: white;
            border: 1px solid #EBEEF0;
            margin-top: 20px;
        }

        .panel-heading {
            padding-top: 0px;
        }

        .panel-title {
            background-color: #0070c9;
            margin-bottom: 0px;
            margin-top: 0px;
            line-height: 50px;
            font-weight: normal;
            padding-left: 20px;
            font-size: large;
            color: white;
            font-family: 'Open Sans' Arial, Helvetica, sans-serif;
        }

        .message-body {
            padding: 15px;
            font-size: 20px;
        }

        @media (min-width: 768px)and (max-width: 992px) {
            body > .panel {
                width: 98%;
            }

            .message-body {
                font-size: 30px;
            }
        }

        @media only screen and (min-device-width: 1024px) and (max-device-width: 1366px) and (-webkit-min-device-pixel-ratio: 1.5) {
            body > .panel {
                width: 98%;
            }

            .message-body {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="panel-heading">
            <h3 class="panel-title">
                {emailHeader}
            </h3>
        </div>
        <div class="message-body">
            <p><strong>Hello {ReviewerCompanyName},</strong></p>
            <p>You’ve received a response to your review from <strong>{ReviewedCompanyName} (USDOT {ReviewedUSDOT}):</strong></p>
            <blockquote>
               {ReplyText}
            </blockquote>
            <br />
            <p>
                <strong>{ReviewedCompanyRepresentativeOne}</strong>
            </p>
        </div>
    </div>
</body>
</html>
